commands:
    chatluna:
        description: 'ChatLuna related commands.'
        conversation:
            description: ChatLuna conversation lifecycle commands.
            options:
                conversation: Target conversation by seq, ID, or title.
                page: Page number.
                limit: Items per page.
                archived: Include archived conversations.
                preset: Preset lane.
            new:
                description: Create and switch to a new conversation.
                arguments:
                    title: Conversation title.
            switch:
                description: Switch the active conversation.
                arguments:
                    conversation: Target conversation by seq, ID, or title.
            list:
                description: List conversations in the current route.
            current:
                description: Show the current active conversation.
            rename:
                description: Rename the current or target conversation.
                arguments:
                    title: New conversation title.
            archive:
                description: Archive a conversation.
                arguments:
                    conversation: Target conversation by seq, ID, or title.
            restore:
                description: Restore an archived conversation.
                arguments:
                    conversation: Target conversation by seq, ID, or title.
            export:
                description: Export a conversation as a markdown transcript.
                arguments:
                    conversation: Target conversation by seq, ID, or title.
            compress:
                description: Compress a conversation without referencing rooms.
                arguments:
                    conversation: Target conversation by seq, ID, or title.
            delete:
                description: Delete the current or target conversation.
                arguments:
                    conversation: Target conversation by seq, ID, or title.
        new:
            description: Create and switch to a new conversation.
            arguments:
                title: Conversation title.
            options:
                preset: Preset lane.
                model: Target model name.
                chatMode: Target chat mode.
        switch:
            description: Switch the active conversation.
            arguments:
                conversation: Target conversation by seq, ID, or title.
            options:
                preset: Preset lane.
        list:
            description: List conversations in the current route.
            options:
                page: Page number.
                limit: Items per page.
                archived: Include archived conversations.
                all: Include archived conversations.
                preset: Preset lane.
        current:
            description: Show the current active conversation.
            options:
                preset: Preset lane.
        rename:
            description: Rename the current or target conversation.
            arguments:
                title: New conversation title.
            options:
                preset: Preset lane.
        archive:
            description: Archive a conversation.
            arguments:
                conversation: Target conversation by seq, ID, or title.
            options:
                preset: Preset lane.
        restore:
            description: Restore an archived conversation.
            arguments:
                conversation: Target conversation by seq, ID, or title.
            options:
                preset: Preset lane.
                archived: Include archived conversations.
                all: Include archived conversations.
        export:
            description: Export a conversation as a markdown transcript.
            arguments:
                conversation: Target conversation by seq, ID, or title.
            options:
                preset: Preset lane.
                archived: Include archived conversations.
                all: Include archived conversations.
        compress:
            description: Compress a conversation without referencing rooms.
            arguments:
                instruction: Extra compression instruction.
            options:
                conversation: Target conversation by seq, ID, or title.
                preset: Preset lane.
                archived: Include archived conversations.
                all: Include archived conversations.
            messages:
                success: '{0} -> {1}, {2}%'
                skipped: 'Compression skipped. {0} -> {1}, {2}%'
                no_conversation: 'No conversation is available to compress.'
                failed: 'Failed to compress chat history for conversation {0} ({1}): {2}'
        delete:
            description: Delete the current or target conversation.
            arguments:
                conversation: Target conversation by seq, ID, or title.
            options:
                preset: Preset lane.
                archived: Include archived conversations.
                all: Include archived conversations.
        use:
            description: Update the active conversation usage settings.
            model:
                description: Switch the conversation model.
                arguments:
                    model: Target model name.
                options:
                    preset: Preset lane.
            preset:
                description: Switch the conversation preset.
                arguments:
                    preset: Target preset keyword.
                options:
                    lane: Preset lane to operate on.
            mode:
                description: Switch the conversation chat mode.
                arguments:
                    mode: Target chat mode.
                options:
                    preset: Preset lane.
        rule:
            description: Manage route-level conversation rules.
            model:
                description: Fix or reset the model for the current route.
                arguments:
                    model: Target model or `reset`.
            preset:
                description: Fix or reset the preset for the current route.
                arguments:
                    preset: Target preset or `reset`.
            mode:
                description: Fix or reset the chat mode for the current route.
                arguments:
                    mode: Target chat mode or `reset`.
            share:
                description: Set the route sharing mode for the current route.
                arguments:
                    mode: '`shared`, `personal`, or `reset`.'
            lock:
                description: Lock or unlock conversation management for the current route.
                arguments:
                    state: '`on`, `off`, `toggle`, or `reset`.'
            show:
                description: Show the current route rule state.
        chat:
            description: ChatLuna conversation commands.
            messages:
                conversation_not_exist: 'Conversation does not exist.'
            text:
                description: Initiate a text conversation with the AI model.
                options:
                    conversation: Target conversation by seq, ID, or title.
                    preset: Preset lane.
                    type: Message rendering type.
                examples:
                    - chatluna chat text -t text Hello, world!
                    - chatluna chat text -t voice Hello, world!
                    - chatluna chat text -c 123e4567-e89b-12d3-a456-426614174000 -t text Hello, world!
                arguments:
                    message: Message content to send.
                messages:
                    invalid-render-type: 'Invalid rendering type. Supported types: `text` and `voice`.'
            rollback:
                description: Regenerate last conversation content.
                options:
                    conversation: Target conversation by seq, ID, or title.
                    i: Number of rounds to roll back.
                arguments:
                    message: New message content.
                messages:
                    conversation_not_found: 'Conversation not found.'
                    conversation_not_exist: 'Conversation does not exist.'
                    no_chat_history: 'Chat history not found.'
                    invalid_chat_history: 'Invalid chat history. Clear history and retry.'
                    rollback_success: 'Successfully rolled back to {0} rounds ago.'
            stop:
                description: Immediately terminate ongoing conversation.
                options:
                    conversation: Target conversation by seq, ID, or title.
                messages:
                    conversation_not_found: 'Conversation not found.'
                    no_active_chat: 'No active conversation is running.'
                    stop_failed: 'Failed to stop conversation.'
                    success: 'Conversation stopped successfully.'
            compress:
                description: Manually compress chat history using Infinite Context.
                options:
                    conversation: Target conversation by seq, ID, or title.
                messages:
                    success: '{0} -> {1}, {2}%'
                    skipped: 'Compression skipped. {0} -> {1}, {2}%'
                    conversation_not_found: 'Conversation not found.'
                    failed: 'Failed to compress chat history for conversation {0}: {1}'
            voice:
                description: Converse with AI model and receive voice output.
                options:
                    conversation: Target conversation by seq, ID, or title.
                    speaker: Character ID for voice service.
                arguments:
                    message: Message content to send.
        wipe:
            description: Clear all ChatLuna usage data (use with caution).
            messages:
                confirm_wipe: |
                    Warning: You are about to clear all ChatLuna data, including:
                    1. All session data
                    2. Cached database data
                    3. Local vector database data

                    To confirm deletion, enter the result of: {0}.
                timeout: 'Deletion timed out. Operation cancelled.'
                incorrect_input: 'Incorrect input. Deletion cancelled.'
                success: 'Data deleted. Restarting to apply changes.'

        restart:
            description: Restart the ChatLuna.
            messages:
                success: Successfully restarted ChatLuna.

        admin:
            purge-legacy:
                description: Purge migrated legacy ChatLuna data.

        model:
            description: ChatLuna model management.
            list:
                description: Display available models.
                usage: 'chatluna model list --page 1 --limit 10'
                options:
                    page: Page number
                    limit: Items per page
                messages:
                    header: 'Available models:'
                    footer: 'Set default model per conversation with chatluna.new -p [preset] or chatluna.switch.'
                    pages: 'Page: [page] / [total]'
            search:
                description: 'Search available models.'
                arguments:
                    query: 'Search keyword'
                usage: 'chatluna model search openai --page 1 --limit 10'
                options:
                    page: 'Page number'
                    limit: 'Items per page'
                messages:
                    header: 'Search results:'
                    footer: 'Set default model per conversation with chatluna.new -p [preset] or chatluna.switch.'
                    pages: 'Page: [page] / [total]'
            test:
                description: Test if a specified model or adapter is available.
                arguments:
                    model: Model name (e.g., openai/gpt-3.5-turbo) or platform name (e.g., openai).
                usage: 'chatluna model test openai/gpt-3.5-turbo'
                messages:
                    platform_not_found: 'Platform {0} not found. Please check the platform name or ensure the adapter is installed.'
                    platform_unavailable: 'Platform {0} is unavailable. Please check the configuration or wait for the platform to load.'
                    model_not_found: 'Model {0} not found. Please verify the model name is correct.'
                    invalid_model_format: 'Invalid model format: {0}. Expected format: platform/model (e.g., openai/gpt-3.5-turbo).'
                    testing: 'Testing model {0}, please wait...'
                    test_success: "Model {0} test successful!\nResponse time: {1}ms\nSample response: {2}"
                    test_success_no_content: "Model {0} test successful!\nResponse time: {1}ms\n(No content returned by model)"
                    test_failed: "Model {0} test failed!\nResponse time: {1}ms\nError message: {2}"
                    test_error: 'Error occurred during testing: {0}'

        tool:
            description: ChatLuna tool management.
            list:
                description: Display available tools.
                usage: 'chatluna tool list --page 1 --limit 10'
                options:
                    page: Page number
                    limit: Items per page
                messages:
                    header: 'Available tools:'
                    footer: 'You can use these tools in conversations to enhance model capabilities'
                    pages: 'Page: [page] / [total]'

        mcp:
            description: 'MCP tool management commands'
            list:
                description: 'List all MCP tools'
                options:
                    raw: 'List raw MCP server configurations'
                messages:
                    list_servers_header: 'Current MCP server configurations:'
                    server_name: 'Server name: {0}'
                    server_config: 'Server config:\n{0}'
                    empty_servers: 'No MCP servers configured.'
                    list_tools_header: 'Available MCP tools:'
                    tool_name: 'Tool name: {0}'
                    tool_enabled: 'Status: {0}'
                    tool_description: 'Description: {0}'
                    tool_selector: 'Selector: {0}'
                    no_selector: 'None'
                    no_description: 'No description'
                    empty_tools: 'No MCP tools registered.'
                    parse_error: 'Failed to parse MCP server configuration. Please check the format.'
                    list_error: 'Error listing tools: {0}'
                    service_not_ready: 'MCP service is not ready. Please try again later.'
            add:
                description: 'Add MCP server'
                arguments:
                    mcpConfig: 'MCP server configuration (JSON format)'
                messages:
                    add_usage: 'Usage: chatluna.mcp.add <mcpConfig>\n\nExample:\nchatluna.mcp.add {"mcpServers": {"server1": {"command": "node", "args": ["server.js"]}}}'
                    add_conflict: 'The following server names already exist: {0}'
                    add_overwrite_confirm: 'Overwrite existing server configuration? Enter Y to confirm, any other input to cancel.'
                    add_cancelled: 'Add operation cancelled.'
                    add_success: 'Successfully added {0} MCP server(s).'
                    add_error: 'Error adding MCP server: {0}'
                    restart_required: 'Note: Changes will take effect after restart.'
            remove:
                description: 'Remove MCP server'
                arguments:
                    serverName: 'Server name'
                messages:
                    remove_usage: 'Usage: chatluna.mcp.remove <serverName>\n\nExample:\nchatluna.mcp.remove server1'
                    server_not_found: 'Server {0} not found.'
                    remove_success: 'Successfully removed server {0}.'
                    remove_error: 'Error removing server: {0}'
                    restart_required: 'Note: Changes will take effect after restart.'
                    empty_servers: 'No MCP servers configured.'
            enable:
                description: 'Enable or disable MCP tool'
                arguments:
                    toolName: 'Tool name'
                messages:
                    enable_usage: 'Usage: chatluna.mcp.enable <toolName>\n\nExample:\nchatluna.mcp.enable my_tool'
                    tool_not_found: 'Tool {0} not found.'
                    enable_success: 'Tool {0} has been {1}.'
                    enable_error: 'Error toggling tool status: {0}'
                    service_not_ready: 'MCP service is not ready. Please try again later.'
                    status_enabled: 'enabled'
                    status_disabled: 'disabled'

        memory:
            description: 'ChatLuna memory-related commands.'

            search:
                description: 'Search memories.'
                arguments:
                    query: 'Search keyword.'
                usage: 'chatluna memory search --query "Hello" --page 1 --limit 10'
                options:
                    page: 'Page number.'
                    limit: 'Items per page.'
                    preset: 'Preset lane.'
                    type: 'Memory preset.'
                    view: 'Memory layer.'
                messages:
                    header: 'Here is the list of memories found using the keyword {0} under the {1} layer:'
                    footer: ''
                    document_content: 'Memory content: {0}'
                    document_id: 'Memory ID: {0}'
                    document_type: 'Memory type: {0}'
                    document_expire: 'Memory expire: {0}'
                    document_level: 'Memory level: {0}'
                    pages: 'Page: [page] / [total]'
                    search_failed: 'Failed to search memories.'
                    invalid_view: 'Invalid view type. Currently supported types are: {0}.'

            delete:
                description: 'Delete memory.'
                arguments:
                    ids: 'Memory ID list.'
                options:
                    preset: 'Preset lane.'
                    type: 'Memory preset.'
                    view: 'Memory layer.'
                messages:
                    delete_success: 'Memory deleted successfully.'
                    delete_failed: 'Failed to delete memory.'
                    invalid_view: 'Invalid view type. Currently supported types are: {0}.'

            clear:
                description: 'Clear memory.'
                options:
                    preset: 'Preset lane.'
                    type: 'Memory preset.'
                    view: 'Memory layer.'
                messages:
                    clear_success: 'Memory cleared successfully.'
                    clear_failed: 'Failed to clear memory.'
                    invalid_view: 'Invalid view type. Currently supported types are: {0}.'

            add:
                description: 'Add memory.'
                arguments:
                    content: 'Memory content.'
                options:
                    preset: 'Preset lane.'
                    type: 'Memory preset.'
                    view: 'Memory layer.'
                messages:
                    add_success: 'Memory added successfully.'
                    add_failed: 'Failed to add memory.'
                    invalid_view: 'Invalid view type. Currently supported types are: {0}.'

            edit:
                description: 'Edit memory.'
                arguments:
                    id: 'Memory ID.'
                options:
                    preset: 'Preset lane.'
                    type: 'Memory preset.'
                    view: 'Memory layer.'
                messages:
                    edit_success: 'Memory edited successfully.'
                    edit_failed: 'Failed to edit memory.'
                    edit_memory_start: 'Please send your new memory content.'
                    invalid_view: 'Invalid view type. Currently supported types are: {0}.'

        preset:
            description: 'ChatLuna preset management.'
            list:
                description: 'Display available presets.'
                options:
                    page: 'Page number'
                    limit: 'Items per page'
                messages:
                    header: 'Available presets:'
                    footer: 'Set default preset per conversation with chatluna.new -p [preset] or chatluna.switch.'
                    pages: 'Page: [page] / [total]'
                    preset_keyword: 'Keyword: {0}'
                    preset_content: 'Content: {0}'
            add:
                description: 'Create new preset.'
                arguments:
                    preset: 'Preset name'
                messages:
                    conflict: 'Preset keyword conflict. Choose a different keyword.'
                    prompt: 'Enter preset content.'
                    timeout: 'Operation timed out. Cancelled adding preset: {0}'
                    success: 'Preset "{0}" created. Use chatluna.preset.list to view.'
            clone:
                description: 'Duplicate existing preset.'
                arguments:
                    originPreset: 'Source preset'
                    newPresetName: 'New preset name'
                messages:
                    conflict: 'Preset keyword conflict. Choose a different name.'
                    confirm: 'Confirm cloning preset {0}? Enter Y to proceed.'
                    timeout: 'Operation timed out. Cancelled.'
                    cancelled: 'Operation cancelled.'
                    success: 'Preset "{0}" cloned. Use chatluna.preset.list to view.'
            set:
                description: 'Update existing preset.'
                arguments:
                    preset: 'Preset name'
                messages:
                    not_found: 'Preset not found.'
                    not_support: 'Cannot modify preset {0}. This complex preset requires editing via the control panel resource manager.'
                    timeout: 'Operation timed out. Cancelled.'
                    cancelled: 'Operation cancelled.'
                    enter_content: 'Enter new preset content.'
                    success: 'Preset "{0}" updated. Use chatluna.preset.list to view.'
            delete:
                description: 'Remove specified preset.'
                arguments:
                    preset: 'Preset name'
                messages:
                    only_one_preset: 'Cannot delete the only existing preset.'
                    not_found: 'Preset not found. Check the name and try again.'
                    confirm_delete: 'Delete preset {0}? Y to confirm, any other key to cancel. Note: Associated sessions will switch to another available preset.'
                    timeout: 'Operation timed out. Cancelled deleting preset: {0}.'
                    cancelled: 'Cancelled deleting preset: {0}'
                    success: 'Preset {0} deleted. Restarting to apply changes.'

        embeddings:
            description: 'ChatLuna embedding model management.'
            list:
                description: 'View embedding models.'
                options:
                    page: 'Page number'
                    limit: 'Items per page'
                messages:
                    header: 'Supported embedding models:'
                    footer: 'Set default: chatluna.embeddings.set [model]'
                    pages: 'Page: [page] / [total]'
            set:
                description: 'Set default embedding model.'
                arguments:
                    embeddings: 'Model name'
                messages:
                    usage_hint: 'Usage: chatluna.embeddings.set [model]'
                    multiple_models_found:
                        header: 'Multiple models found:'
                        footer: 'Please provide a more specific model name'
                        example: 'Example: chatluna.embeddings.set {0}'
                    model_not_found: 'Model not found. Check the name and try again.'
                    success: 'Default set to {0}. Restarting plugin to apply.'

        vectorstore:
            description: 'ChatLuna vector database management.'
            list:
                description: 'View vector databases.'
                options:
                    page: 'Page number'
                    limit: 'Items per page'
                messages:
                    header: 'Supported vector databases:'
                    footer: 'Set default: chatluna.vectorstore.set [model] (uses in-memory if none set)'
                    pages: 'Page: [page] / [total]'
            set:
                description: 'Set default vector database.'
                arguments:
                    vectorStore: 'Database name'
                messages:
                    usage_hint: 'Usage: chatluna.vectorstore.set [model]'
                    multiple_stores_found:
                        header: 'Multiple databases found:'
                        footer: 'Please provide a more specific database name'
                        example: 'Example: chatluna.vectorstore.set {0}'
                    store_not_found: 'Database not found. Check the name and try again.'
                    success: 'Default set to {0}. Restarting plugin to apply.'

