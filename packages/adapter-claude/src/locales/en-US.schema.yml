$inner:
  - {}
  - $desc: 'Adapter Configuration'
    platform: 'Adapter platform name'
    pullModels: 'Auto-fetch model list. If disabled, use only specified models'
    additionalModels:
        $desc: 'Additional models'
        $inner:
            model: 'Model name'
            contextSize: 'Context size'
            modelCapabilities:
              $desc: Model supported capabilities
              $inner:
                  - Tool calling
                  - Visual image input

  - $desc: 'API Configuration'
    apiKeys:
      $inner:
        - 'Claude API Key'
        - 'Claude API Endpoint'
        - 'Enabled'
      $desc: 'List of Claude API credentials'

  - $desc: 'Model Parameters'
    maxContextRatio: 'Maximum context usage ratio (0-1). Controls the maximum percentage of model context window available for use. For example, 0.35 means at most 35% of the model context can be used.'
    temperature: 'Sampling temperature (higher values increase randomness)'
    presencePenalty: 'Token presence penalty (-2 to 2, step 0.1, higher values discourage token repetition)'
    frequencyPenalty: 'Token frequency penalty (-2 to 2, step 0.1, higher values reduce repetition of frequent tokens)'
