$inner:
  - $desc: HippoRAG Long-term Memory
    hippoSimilarityThreshold: Final hybrid score threshold (0.0~1.0; higher = stricter).
    hippoPPRAlpha: Personalized PageRank alpha (0~1, default 0.15).
    hippoTopEntities: Number of top-scored entities used to expand candidates.
    hippoMaxCandidates: Maximum candidates from PPR expansion.
    hippoHybridWeight: Hybrid re-ranking weight (human-like score share; rest for PPR). 0.8 biases toward semantic/fingerprint robustness.
    hippoQueryRewrite: Whether to rewrite the query via model before retrieval.
    hippoInterval: Interval (in turns) for memory extraction.
    hippoIEEnabled: Enable triple extraction (build relation edges to strengthen the graph).
    hippoBridgeThreshold: Entity bridging threshold using char-shingle Jaccard.
    hippoReinforceTopK: Only reinforce top K hits per retrieval (reduce write amplification).
    hippoLayer:
      $desc: Enabled retrieval layers
      $inner:
        - Global layer. Memories are shared across all rooms.
        - Preset layer. Memories shared across rooms with the same preset.
        - Preset/User layer. Primary retrieval layer; user chat memories are added here by default; differentiated by user and preset.
        - User layer. Per-user memories shared across all presets.
    hippoExtractModel: Model used for memory extraction / query rewrite (faster models improve throughput).
