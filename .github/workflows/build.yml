name: Build

on:
    pull_request:

jobs:
    prepare:
        runs-on: ubuntu-latest

        steps:
            - name: Check out
              uses: actions/checkout@v6
            - name: Set up Node
              uses: actions/setup-node@v6
              with:
                  node-version: 24
            - name: Enable Corepack
              run: corepack enable
            - id: cache
              name: Yarn Cache Dir
              run: echo "value=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT
            - name: Restore Lockfile
              uses: actions/cache@v5
              with:
                  path: yarn.lock
                  key: yarn-lock-${{ github.sha }}
            - name: Restore Cache
              uses: actions/cache@v5
              with:
                  path: ${{ steps.cache.outputs.value }}
                  key: yarn-cache-node-24-${{ hashFiles('**/package.json') }}
                  restore-keys: yarn-cache-node-24-
            - name: Install
              run: yarn --no-immutable

        outputs:
            cache-dir: ${{ steps.cache.outputs.value }}

    build:
        runs-on: ubuntu-latest
        needs:
            - prepare

        steps:
            - name: Check out
              uses: actions/checkout@v6
            - name: Set up Node
              uses: actions/setup-node@v6
              with:
                  node-version: 24
            - name: Enable Corepack
              run: corepack enable
            - name: Restore Lockfile
              uses: actions/cache@v5
              with:
                  path: yarn.lock
                  key: yarn-lock-${{ github.sha }}
            - name: Restore Cache
              uses: actions/cache@v5
              with:
                  path: ${{ needs.prepare.outputs.cache-dir }}
                  key: yarn-cache-node-24-${{ hashFiles('**/package.json') }}
                  restore-keys: yarn-cache-node-24-
            - name: Install
              run: yarn
            - name: Build Clean
              run: yarn build --clean
            - name: Build
              run: yarn build

    lint:
        # if: ${{  github.event_name == 'pull_request' }}
        runs-on: ubuntu-latest
        needs:
            - prepare

        steps:
            - name: Check out
              uses: actions/checkout@v6
            - name: Set up Node
              uses: actions/setup-node@v6
              with:
                  node-version: 24
            - name: Enable Corepack
              run: corepack enable
            - name: Restore Lockfile
              uses: actions/cache@v5
              with:
                  path: yarn.lock
                  key: yarn-lock-${{ github.sha }}
            - name: Restore Cache
              uses: actions/cache@v5
              with:
                  path: ${{ needs.prepare.outputs.cache-dir }}
                  key: yarn-cache-node-24-${{ hashFiles('**/package.json') }}
                  restore-keys: yarn-cache-node-24-
            - name: Install
              run: yarn
            - name: Lint
              run: yarn lint
